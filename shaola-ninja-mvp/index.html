<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17151b"><title>烧腊忍者 · 五关MVP</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#17151b;color:#fff2d6;font:700 16px system-ui}#m{opacity:.85}</style></head><body><div id="m">明档开火，正在加载……</div><script>(async()=>{const n=7;const p=await Promise.all(Array.from({length:n},(_,i)=>fetch('./c'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('资源 '+i+' 加载失败');return r.text()})));const b=atob(p.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari');const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()})().catch(e=>{document.getElementById('m').textContent='加载失败：'+e.message})</script></body></html>
